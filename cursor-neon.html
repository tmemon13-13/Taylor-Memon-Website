<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Cursor Demo</title>
  <style>
    * { cursor: none !important; box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0A0018;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      font-family: sans-serif;
      color: white;
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, #FF2D78, #9B30FF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p { color: rgba(255,255,255,0.5); max-width: 400px; line-height: 1.7; }

    .demo-btn {
      padding: 0.8rem 2rem;
      background: linear-gradient(135deg, #FF2D78, #9B30FF);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
    }

    a { color: #FF2D78; }

    /* ─── NEON CURSOR ─── */

    /* Outer glow ring */
    #neon-ring {
      position: fixed;
      top: 0; left: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #FF2D78;
      box-shadow:
        0 0 6px #FF2D78,
        0 0 12px #FF2D78,
        0 0 24px #CC00FF;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition:
        width 0.2s ease,
        height 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        opacity 0.3s ease;
      opacity: 0;
    }

    /* Inner glowing dot */
    #neon-dot {
      position: fixed;
      top: 0; left: 0;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: white;
      box-shadow:
        0 0 4px #fff,
        0 0 8px #FF2D78,
        0 0 16px #FF2D78,
        0 0 30px #9B30FF;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition:
        width 0.15s ease,
        height 0.15s ease,
        box-shadow 0.2s ease,
        opacity 0.3s ease;
      opacity: 0;
    }

    /* Sparkle trail particles */
    .spark {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9997;
      transform: translate(-50%, -50%);
      animation: sparkFade 0.6s ease-out forwards;
    }

    @keyframes sparkFade {
      0%   { opacity: 1;   transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0;   transform: translate(-50%, -50%) scale(0); }
    }
  </style>
</head>
<body>

  <!-- Cursor elements -->
  <div id="neon-ring"></div>
  <div id="neon-dot"></div>

  <!-- Demo content -->
  <h1>✦ Neon Cursor Demo</h1>
  <p>Move your mouse around to see the glowing pink-to-purple neon effect with sparkle trail. Hover the button to see it expand.</p>
  <button class="demo-btn">Hover over me ✨</button>
  <a href="#">Or hover this link</a>

  <script>
    const ring = document.getElementById('neon-ring');
    const dot  = document.getElementById('neon-dot');

    let mx = 0, my = 0;
    let rx = 0, ry = 0;
    let visible = false;

    // Gradient colors
    const colors = [
      '#FF2D78', '#E0259A', '#C81DB8', '#B015D6', '#9B30FF'
    ];

    // Move dot instantly
    document.addEventListener('mousemove', e => {
      mx = e.clientX;
      my = e.clientY;

      dot.style.left = mx + 'px';
      dot.style.top  = my + 'px';

      if (!visible) {
        visible = true;
        dot.style.opacity  = '1';
        ring.style.opacity = '1';
      }

      spawnSpark(mx, my);
    });

    // Hide on leave
    document.addEventListener('mouseleave', () => {
      dot.style.opacity  = '0';
      ring.style.opacity = '0';
    });
    document.addEventListener('mouseenter', () => {
      dot.style.opacity  = '1';
      ring.style.opacity = '1';
    });

    // Ring follows with lag
    (function animateRing() {
      rx += (mx - rx) * 0.1;
      ry += (my - ry) * 0.1;
      ring.style.left = rx + 'px';
      ring.style.top  = ry + 'px';
      requestAnimationFrame(animateRing);
    })();

    // Sparkle trail
    let sparkCount = 0;
    function spawnSpark(x, y) {
      sparkCount++;
      if (sparkCount % 3 !== 0) return; // every 3rd move

      const spark = document.createElement('div');
      spark.classList.add('spark');

      const size = Math.random() * 6 + 3;
      const color = colors[Math.floor(Math.random() * colors.length)];
      const offsetX = (Math.random() - 0.5) * 16;
      const offsetY = (Math.random() - 0.5) * 16;

      spark.style.cssText = `
        left: ${x + offsetX}px;
        top: ${y + offsetY}px;
        width: ${size}px;
        height: ${size}px;
        background: ${color};
        box-shadow: 0 0 ${size * 2}px ${color};
      `;

      document.body.appendChild(spark);
      setTimeout(() => spark.remove(), 600);
    }

    // Hover expand effect
    document.querySelectorAll('a, button, [role="button"]').forEach(el => {
      el.addEventListener('mouseenter', () => {
        ring.style.width       = '60px';
        ring.style.height      = '60px';
        ring.style.borderColor = '#9B30FF';
        ring.style.boxShadow   = `
          0 0 10px #9B30FF,
          0 0 20px #9B30FF,
          0 0 40px #FF2D78
        `;
        dot.style.width  = '12px';
        dot.style.height = '12px';
        dot.style.boxShadow = `
          0 0 6px #fff,
          0 0 14px #9B30FF,
          0 0 28px #9B30FF,
          0 0 50px #FF2D78
        `;
      });
      el.addEventListener('mouseleave', () => {
        ring.style.width       = '40px';
        ring.style.height      = '40px';
        ring.style.borderColor = '#FF2D78';
        ring.style.boxShadow   = `
          0 0 6px #FF2D78,
          0 0 12px #FF2D78,
          0 0 24px #CC00FF
        `;
        dot.style.width  = '8px';
        dot.style.height = '8px';
        dot.style.boxShadow = `
          0 0 4px #fff,
          0 0 8px #FF2D78,
          0 0 16px #FF2D78,
          0 0 30px #9B30FF
        `;
      });
    });
  </script>

</body>
</html>
